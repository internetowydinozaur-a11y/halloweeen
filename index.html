
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Page</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

/* Napis */
h1 {
    color: black;
    font-size: clamp(35px, 8vw, 90px);
    text-align: center;
    z-index: 2;
    opacity: 0;
    animation: revealText 2s ease forwards;
    animation-delay: 5s;
}

/* Czerwona warstwa */
.blood {
    position: fixed;
    top: -100%;
    left: 0;
    width: 100%;
    height: 110%;
    background: #a00000;
    z-index: 1;
    animation: bloodFlow 5s ease-in-out forwards;
}

/* Krople krwi */
.drop {
    position: absolute;
    top: 0;
    width: 35px;
    height: 100px;
    background: #a00000;
    border-radius: 0 0 50% 50%;
}

.drop:nth-child(1) {
    left: 10%;
    height: 180px;
    animation: drip 4s ease-in forwards;
}

.drop:nth-child(2) {
    left: 35%;
    height: 120px;
    animation: drip 3.5s ease-in forwards;
}

.drop:nth-child(3) {
    left: 65%;
    height: 220px;
    animation: drip 4.5s ease-in forwards;
}

.drop:nth-child(4) {
    left: 85%;
    height: 150px;
    animation: drip 3.8s ease-in forwards;
}

@keyframes bloodFlow {
    0% {
        top: -110%;
    }
    100% {
        top: 0;
    }
}

@keyframes drip {
    0% {
        transform: translateY(-200px);
    }
    100% {
        transform: translateY(100vh);
    }
}

@keyframes revealText {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

</style>
</head>

<body>

<div class="blood">
    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>
</div>

<h1>ukojcie moje pragnienie</h1>

</body>
</html>
