
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Page</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

/* CZERWONA CIECZ */
.blood {
    position: fixed;
    top: -120%;
    left: 0;
    width: 100%;
    height: 125%;
    background: linear-gradient(
        180deg,
        #570000,
        #a00000 35%,
        #d00000 75%,
        #790000
    );
    z-index: 1;
    animation: flow 6s ease-in-out forwards;
}

/* Nieregularna dolna krawędź */
.blood::after {
    content: "";
    position: absolute;
    top: 99%;
    left: -5%;
    width: 110%;
    height: 100px;
    background: #a00000;
    border-radius: 45% 55% 0 0;
    filter: blur(5px);
}

/* Krople */
.drop {
    position: absolute;
    top: 95%;
    width: 35px;
    height: 130px;
    background: linear-gradient(
        90deg,
        #650000,
        #d00000,
        #850000
    );
    border-radius: 0 0 50% 50%;
    filter: blur(1px);
    transform-origin: top;
}

.drop:nth-child(1) {
    left: 8%;
    height: 180px;
    width: 28px;
}

.drop:nth-child(2) {
    left: 22%;
    height: 90px;
    width: 42px;
}

.drop:nth-child(3) {
    left: 43%;
    height: 220px;
    width: 32px;
}

.drop:nth-child(4) {
    left: 62%;
    height: 130px;
    width: 48px;
}

.drop:nth-child(5) {
    left: 79%;
    height: 190px;
    width: 30px;
}

.drop:nth-child(6) {
    left: 94%;
    height: 110px;
    width: 38px;
}

/* Animacja spływania */
@keyframes flow {
    0% {
        top: -120%;
    }
    100% {
        top: 0;
    }
}

/* NAPIS */
h1 {
    position: relative;
    z-index: 2;
    color: #000;
    font-size: clamp(35px, 8vw, 90px);
    text-align: center;
    opacity: 0;
    animation: reveal 2s ease forwards;
    animation-delay: 6s;
}

@keyframes reveal {
    to {
        opacity: 1;
    }
}

</style>
</head>

<body>

<div class="blood">
    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>
</div>

<h1>ukojcie moje pragnienie</h1>

</body>
</html>
